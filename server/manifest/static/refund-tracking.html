<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>退款跟进 · 客服端</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<script src="app.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#e8f4ef]">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f7fbf9] flex flex-col overflow-hidden relative text-[#2b3a34]">
<header class="shrink-0 bg-white px-4 pt-3 pb-2.5 border-b border-[#eef4f1]">
<div class="flex items-center gap-3">
<a class="w-8 h-8 grid place-items-center text-[#4a6357]" href="workbench.html">
<iconify-icon class="text-xl" icon="mdi:arrow-left"></iconify-icon>
</a>
<div class="flex-1">
<h1 class="text-[15px] font-bold text-[#1d3a2e]">退款跟进</h1>
<p class="text-[10px] text-[#8aa398] mt-0.5">客服 周宁 · 只改退款单状态</p>
</div>
<span class="px-2 py-1 rounded-full bg-[#fdeee5] text-[#c9563a] text-[10px] font-medium" id="failBadge">失败/待退 -</span>
</div>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-24">
<!-- 汇总 -->
<section class="mt-3 grid grid-cols-3 gap-2">
<div class="rounded-2xl bg-white p-3 shadow-[0_4px_12px_rgba(45,110,85,0.05)]">
<p class="text-[9px] text-[#8aa398]">应退金额</p>
<p class="text-[16px] font-bold text-[#22402f] mt-1 leading-none" id="sumTotal">-</p>
</div>
<div class="rounded-2xl bg-white p-3 shadow-[0_4px_12px_rgba(45,110,85,0.05)]">
<p class="text-[9px] text-[#8aa398]">已退成功</p>
<p class="text-[16px] font-bold text-[#2f8a63] mt-1 leading-none" id="sumOk">-</p>
</div>
<div class="rounded-2xl bg-white p-3 shadow-[0_4px_12px_rgba(45,110,85,0.05)]">
<p class="text-[9px] text-[#8aa398]">失败待重试</p>
<p class="text-[16px] font-bold text-[#c9563a] mt-1 leading-none" id="sumFail">-</p>
</div>
</section>
<!-- 退款失败单 -->
<section class="mt-3">
<div class="flex items-center justify-between mb-2">
<h2 class="text-[12px] font-bold text-[#1d3a2e]">退款单列表</h2>
<span class="text-[10px] text-[#a2b5ab]">退款状态独立于预约状态</span>
</div>
<div class="space-y-2.5" id="refundCards"><div class="text-[11px] text-[#8aa398] text-center py-4">加载中…</div></div>
</section>
<!-- 口径说明 -->
<section class="mt-3 rounded-2xl bg-[#f3effc] border border-[#e5dcf8] p-3.5">
<p class="text-[11px] font-semibold text-[#6a5599] flex items-center gap-1.5">
<iconify-icon class="text-base" icon="mdi:scale-balance"></iconify-icon>
          退款口径说明
        </p>
<ul class="mt-1.5 space-y-1 text-[10px] leading-relaxed text-[#8574ab]">
<li>· 退款失败不回滚预约状态、不恢复名额；预约仍为「已取消」。</li>
<li>· 重试只改退款单状态，成功后累计退款金额进入店长台账。</li>
<li>· 店长对退款仅只读，金额调整需客服执行。</li>
</ul>
</section>
</main>
<nav class="shrink-0 bg-white border-t border-[#e6f0eb] px-1 pt-1 pb-1 flex items-center justify-around text-[9px]">
<a class="flex flex-col items-center gap-0.5 w-14 text-[#9aaba3]" href="workbench.html">
<iconify-icon class="text-[20px]" icon="mdi:view-dashboard-outline"></iconify-icon>
<span>工作台</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-14 text-[#9aaba3]" href="cancel-review.html">
<iconify-icon class="text-[20px]" icon="mdi:file-document-alert-outline"></iconify-icon>
<span>取消审批</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-14 text-[#38a878]" href="refund-tracking.html">
<iconify-icon class="text-[20px]" icon="mdi:cash-refund"></iconify-icon>
<span class="font-medium">退款跟进</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-14 text-[#9aaba3]" href="payment-issue.html">
<iconify-icon class="text-[20px]" icon="mdi:credit-card-alert-outline"></iconify-icon>
<span>异常单</span>
</a>
</nav>
</div>
<script>
function refundCard(r) {
  const failed = r.status === 3, pending = r.status === 1;
  const pill = failed ? '<span class="px-2 py-1 rounded-full bg-[#fdeee5] text-[#c9563a] text-[9px] font-semibold">退款失败</span>'
    : pending ? '<span class="px-2 py-1 rounded-full bg-[#e9f1fe] text-[#3a6fb0] text-[9px] font-semibold">退款中</span>'
    : '<span class="px-2 py-1 rounded-full bg-[#e8f6ef] text-[#2f8a63] text-[9px] font-semibold">退款成功</span>';
  return `
  <div class="rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)] ${failed ? 'border border-[#f3dcd4]' : ''}">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-[12px] font-bold text-[#22402f]">${r.refundId}</p>
        <p class="text-[10px] text-[#a2b5ab] mt-0.5">关联 ${r.appId} · ${r.petName}</p>
      </div>
      ${pill}
    </div>
    <div class="mt-2.5 grid grid-cols-2 gap-2 text-[10px]">
      <div class="rounded-lg bg-[#f7fbf9] px-2.5 py-2"><span class="text-[#a2b5ab]">退款金额</span><p class="text-[12px] font-bold text-[#22402f] mt-0.5">¥${fmtYuan(r.amount)}</p></div>
      <div class="rounded-lg bg-[#f7fbf9] px-2.5 py-2"><span class="text-[#a2b5ab]">失败次数</span><p class="text-[12px] font-bold ${failed ? 'text-[#c9563a]' : 'text-[#22402f]'} mt-0.5">${r.retryCount} 次</p></div>
    </div>
    ${r.failMsg ? `<div class="mt-2 rounded-lg bg-[#fdf6f2] px-2.5 py-2"><p class="text-[9px] text-[#b8683f] font-medium">失败原因</p><p class="text-[10px] text-[#a97a63] mt-0.5 leading-relaxed">${r.failMsg}</p></div>` : ''}
    ${r.refundedAt ? `<div class="mt-2 flex items-center justify-between text-[10px] text-[#8aa398]"><span>${fmtDT(r.refundedAt)} 到账 · 模拟渠道</span><span class="text-[12px] font-bold text-[#22402f]">¥${fmtYuan(r.amount)}</span></div>` : ''}
    ${failed || pending ? `
    <div class="mt-2.5 flex gap-2">
      <button class="flex-1 py-2.5 rounded-full bg-[#38a878] text-white text-[11px] font-semibold" onclick="retryRefund('${r.refundId}',this)" type="button">重试退款</button>
      <a class="flex-1 py-2.5 rounded-full border border-[#e6f0eb] text-[11px] text-[#4a6357] text-center" href="refund.html">C 端退款页</a>
    </div>
    <p class="mt-2 text-[10px] text-[#8574ab] leading-relaxed">重试仅更新退款单状态；预约仍为「已取消」，名额不恢复。</p>` : ''}
  </div>`;
}

async function loadRefunds() {
  await call('/api/shop/refund/list?page=1&size=20', { role: 'staff' }, d => {
    const list = d.list || [];
    document.getElementById('refundCards').innerHTML = list.length ? list.map(refundCard).join('') : '<div class="text-[11px] text-[#8aa398] text-center py-4">暂无退款单</div>';
    const ok = list.filter(r => r.status === 2).reduce((s, r) => s + r.amount, 0);
    const fail = list.filter(r => r.status !== 2).reduce((s, r) => s + r.amount, 0);
    document.getElementById('sumOk').textContent = '¥' + fmtYuan(ok);
    document.getElementById('sumFail').textContent = '¥' + fmtYuan(fail);
    document.getElementById('sumTotal').textContent = '¥' + fmtYuan(ok + fail);
    const n = list.filter(r => r.status !== 2).length;
    document.getElementById('failBadge').textContent = `失败/待退 ${n}`;
  });
}

async function retryRefund(refundId, btn) {
  btn.textContent = '重试请求中…';
  btn.disabled = true;
  try {
    await call('/api/shop/refund/retry', { method: 'POST', role: 'staff', body: { refundId } }, (d, msg) => {
      toast(msg || '已重新发起退款');
      loadRefunds();
    });
  } catch (e) { btn.disabled = false; }
}

loadRefunds();
</script>
</body>
</html>
