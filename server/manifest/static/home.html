<iconify-icon class="text-lg" icon="mdi:clipboard-text-clock-outline"></iconify-icon>

            朝阳区望京SOHO T1 一层 · 距你 1.2km
          </p>

<span class="px-2 py-1 rounded-full bg-white/90 text-[#3f8f6b] font-medium">猫狗全犬种</span>

<span class="px-2 py-1 rounded-full bg-white/90 text-[#c98a3c] font-medium">★ 4.9</span>
</div>
</div>
<div class="w-[74px] h-[74px] rounded-[22px] bg-[#bfe8d5] grid place-items-center shrink-0 shadow-[0_8px_18px_rgba(56,168,120,0.22)]">

</div>

<!-- 主滚动区 -->
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-5 pb-24">
<!-- 服务项目 -->
<section class="mt-1">
<div class="flex items-center justify-between mb-2.5">
<h2 class="text-[15px] font-bold text-[#1d3a2e]">洗护服务</h2>

</div>
<a class="block rounded-2xl bg-white p-4 shadow-[0_6px_18px_rgba(45,110,85,0.07)] active:scale-[0.99] transition" href="booking.html">
<div class="flex gap-3">

</div>
</div>
</a>

<!-- 可预约时段 -->

<!-- 温馨提示 -->
<section class="mt-5 rounded-2xl bg-[#fff8ee] border border-[#f7e7cd] p-3.5">
<div class="flex items-start gap-2">
<iconify-icon class="text-[18px] text-[#e0a250] shrink-0 mt-0.5" icon="mdi:lightbulb-on-outline"></iconify-icon>
<div>

</div>
</div>

<!-- 我的预约入口 -->

</section>
</main>
<!-- 底部 Tab -->
<nav class="shrink-0 bg-white border-t border-[#e6f0eb] px-2 pt-1.5 pb-2 flex items-center justify-around">

<iconify-icon class="text-[22px]" icon="mdi:home-variant"></iconify-icon>
<span class="text-[10px] font-medium">首页</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16 text-[#9aaba3]" href="bookings.html">
<iconify-icon class="text-[22px]" icon="mdi:calendar-blank-outline"></iconify-icon>
<span class="text-[10px]">我的预约</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16 text-[#9aaba3]" href="workbench.html">
<iconify-icon class="text-[22px]" icon="mdi:store-cog-outline"></iconify-icon>
<span class="text-[10px]">门店端</span>
</a>
</nav>
</div>
<script>
let allSlots = [];
let curDay = '';

function slotCard(s) {
  const occupied = 3 - s.remaining;
  const full = s.isFull;
  const pct = Math.round(occupied / 3 * 100);
  return `
  <a class="block rounded-2xl bg-white p-3.5 shadow-[0_4px_14px_rgba(45,110,85,0.06)] ${full ? 'pointer-events-none opacity-80' : 'active:scale-[0.99]'} transition" href="booking.html?slotId=${s.slotId}">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-[46px] h-[46px] rounded-xl ${full ? 'bg-[#f4f6f5]' : 'bg-[#eaf7f0]'} grid place-items-center shrink-0">
          <span class="text-[13px] font-bold ${full ? 'text-[#9aaba3]' : 'text-[#38a878]'}">${fmtHM(s.startTime)}</span>
        </div>
        <div>
          <div class="text-[13px] font-semibold ${full ? 'text-[#5c6f66]' : 'text-[#22402f]'}">${fmtHM(s.startTime)} - ${fmtHM(s.endTime)}</div>
          <div class="text-[11px] ${s.remaining === 1 ? 'text-[#e07a4b] font-medium' : full ? 'text-[#a2b5ab]' : 'text-[#5b7a6d]'} mt-0.5">${full ? '已占用 3 / 剩余 0' : s.remaining === 1 ? `已占用 2 / 仅剩 1 个名额` : `已占用 ${occupied} / 剩余 ${s.remaining} 个名额`}</div>
        </div>
      </div>
      <span class="px-3.5 py-2 rounded-full ${full ? 'bg-[#eceeed] text-[#a9b6b0] cursor-not-allowed' : 'bg-[#38a878] text-white'} text-[12px] font-medium">${full ? '名额已满' : '立即预约'}</span>
    </div>
    <div class="mt-2.5 h-1.5 rounded-full bg-[#eef2f0] overflow-hidden">
      <div class="h-full ${full ? 'w-full bg-[#cdd6d2]' : ''}" ${full ? '' : `style="width:${pct}%;background:#7ad2a9"`}></div>
    </div>
  </a>`;
}

function renderDay(day) {
  curDay = day;
  document.querySelectorAll('.day-btn').forEach(b => {
    b.className = b.dataset.day === day
      ? 'day-btn px-3.5 py-1.5 rounded-full bg-[#38a878] text-white font-medium shrink-0'
      : 'day-btn px-3.5 py-1.5 rounded-full bg-white text-[#5b7a6d] font-medium shrink-0';
  });
  const list = allSlots.filter(s => s.startTime.slice(0, 10) === day);
  const el = document.getElementById('slotList');
  el.innerHTML = list.length ? list.map(slotCard).join('')
    : '<div class="text-[12px] text-[#8aa398] text-center py-6">该日期暂无可约时段</div>';
}

async function loadSlots() {
  const r = await call('/api/user/slot/list', {}, d => { allSlots = d.slots || d; });
  const days = [...new Set(allSlots.map(s => s.startTime.slice(0, 10)))].slice(0, 3);
  const today = new Date();
  const labels = days.map(d => {
    const dt = new Date(d + 'T00:00:00');
    const diff = Math.round((dt - new Date(today.toDateString())) / 86400000);
    return { d, label: (diff === 0 ? '今天 ' : diff === 1 ? '明天 ' : diff === 2 ? '后天 ' : '') + `${dt.getMonth() + 1}/${dt.getDate()}` };
  });
  document.getElementById('dayTabs').innerHTML = labels.map((x, i) =>
    `<button class="day-btn px-3.5 py-1.5 rounded-full ${i === 0 ? 'bg-[#38a878] text-white font-medium' : 'bg-white text-[#5b7a6d] font-medium'} shrink-0" data-day="${x.d}" onclick="renderDay('${x.d}')">${x.label}</button>`).join('');
  renderDay(days[0]);
}

async function loadRecent() {
  const r = await call('/api/user/app/list', {}, () => {});
  const list = r.data.list || [];
  const el = document.getElementById('recentApp');
  if (!list.length) { el.innerHTML = '<div class="text-[12px] text-[#8aa398]">暂无预约记录</div>'; return; }
  const a = list[0];
  el.innerHTML = `
  <a class="flex items-center justify-between" href="booking-detail.html?appId=${a.appId}">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-[#fdeee5] grid place-items-center">
        <iconify-icon class="text-[#e07a4b] text-lg" icon="mdi:calendar-check-outline"></iconify-icon>
      </div>
      <div>
        <p class="text-[12px] font-semibold text-[#22402f]">最近一笔预约 · ${STATUS[a.status]}</p>
        <p class="text-[10px] text-[#8aa398] mt-0.5">${a.appId} · ${fmtDT(a.startTime)}</p>
      </div>
    </div>
    <iconify-icon class="text-[#b6c7bf] text-xl" icon="mdi:chevron-right"></iconify-icon>
  </a>`;
}

loadSlots();
loadRecent();
</script>
</body>
