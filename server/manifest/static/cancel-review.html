<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>取消审批 · 客服端</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<script src="app.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#e8f4ef]">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f7fbf9] flex flex-col overflow-hidden relative text-[#2b3a34]">
<header class="shrink-0 bg-white px-4 pt-3 pb-2.5 border-b border-[#eef4f1]">
<div class="flex items-center gap-3">
<a class="w-8 h-8 grid place-items-center text-[#4a6357]" href="workbench.html">
<iconify-icon class="text-xl" icon="mdi:arrow-left"></iconify-icon>
</a>
<div class="flex-1">
<h1 class="text-[15px] font-bold text-[#1d3a2e]">取消审批</h1>
<p class="text-[10px] text-[#8aa398] mt-0.5">客服 周宁 · 审批一次性且不可逆</p>
</div>
<a class="text-[10px] px-2.5 py-1.5 rounded-full bg-[#f0f7f3] text-[#4a8f6f]" href="refund-tracking.html">退款跟进</a>
</div>
<div class="flex gap-2 mt-2.5">
<button class="tab-btn px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[11px] font-medium" onclick="switchTab('pending', this)">待审批 1</button>
<button class="tab-btn px-3 py-1.5 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[11px]" onclick="switchTab('done', this)">已处理 2</button>
</div>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-28">
<!-- 待审批 -->
<div id="tabPending">
<p class="mt-3 text-[10px] text-[#a2b5ab]">审批期间该预约已冻结，不可核销 / 不可开始服务</p>
<div id="pendingList"><div class="text-[11px] text-[#8aa398] text-center py-6">加载中…</div></div>
</div>
<!-- 已处理 -->
<div class="hidden" id="tabDone">
<div class="mt-3 space-y-2" id="doneList"><div class="text-[11px] text-[#8aa398] text-center py-4">加载中…</div></div>
<div class="mt-3 rounded-2xl bg-[#f3effc] border border-[#e5dcf8] p-3.5">
<p class="text-[10px] leading-relaxed text-[#8574ab]">审批记录不可修改；同意取消后如退款失败，只影响退款单状态，预约保持已取消，名额不恢复。</p>
</div>
</div>
</main>
<nav class="shrink-0 bg-white border-t border-[#e6f0eb] px-1 pt-1 pb-1 flex items-center justify-around text-[9px]">
<a class="flex flex-col items-center gap-0.5 w-14 text-[#9aaba3]" href="workbench.html">
<iconify-icon class="text-[20px]" icon="mdi:view-dashboard-outline"></iconify-icon>
<span>工作台</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-14 text-[#38a878]" href="cancel-review.html">
<iconify-icon class="text-[20px]" icon="mdi:file-document-alert-outline"></iconify-icon>
<span class="font-medium">取消审批</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-14 text-[#9aaba3]" href="refund-tracking.html">
<iconify-icon class="text-[20px]" icon="mdi:cash-refund"></iconify-icon>
<span>退款跟进</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-14 text-[#9aaba3]" href="payment-issue.html">
<iconify-icon class="text-[20px]" icon="mdi:credit-card-alert-outline"></iconify-icon>
<span>异常单</span>
</a>
</nav>
</div>
<script>
async function loadPending() {
  await call('/api/shop/audit/list?page=1&size=20', { role: 'staff' }, d => {
    const list = d.list || [];
    const btns = document.querySelectorAll('.tab-btn');
    btns[0].textContent = '待审批 ' + list.length;
    document.getElementById('pendingList').innerHTML = list.length ? list.map(a => {
      const gap = Math.max(0, Math.floor((new Date(a.startTime) - Date.now()) / 3600000));
      return `
      <section class="mt-2 rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)] border border-[#f7e2c0]">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-xl bg-[#fdf3e3] grid place-items-center shrink-0"><iconify-icon class="text-[#c98a3c] text-xl" icon="mdi:cat"></iconify-icon></div>
            <div>
              <p class="text-[13px] font-bold text-[#22402f]">${a.petName} · ${a.userPhone}</p>
              <p class="text-[10px] text-[#a2b5ab] mt-0.5">${a.appId} · ${fmtDT(a.startTime)}</p>
            </div>
          </div>
          <span class="px-2 py-1 rounded-full bg-[#fdf3e3] text-[#c98a3c] text-[9px] font-semibold">待审核取消</span>
        </div>
        <div class="mt-3 rounded-xl bg-[#faf7f1] px-3 py-2.5 space-y-1.5 text-[10px]">
          <div class="flex justify-between"><span class="text-[#a2b5ab]">申请时间</span><span class="text-[#4a6357]">${fmtDT(a.cancelApplyAt)}</span></div>
          <div class="flex justify-between"><span class="text-[#a2b5ab]">距时段开始</span><span class="text-[#c9563a] font-medium">${gap} 小时（不足 2h 转人工）</span></div>
          <div class="flex justify-between"><span class="text-[#a2b5ab]">取消原因</span><span class="text-[#4a6357]">${a.cancelReason || '-'}</span></div>
          <div class="flex justify-between"><span class="text-[#a2b5ab]">预约款</span><span class="text-[#22402f] font-semibold">¥${fmtYuan(a.price)}</span></div>
        </div>
        <div class="mt-3 rounded-xl bg-white border border-[#eef4f1] px-3 py-2.5">
          <p class="text-[11px] font-bold text-[#1d3a2e]">审批前校验</p>
          <div class="space-y-1.5 mt-1.5 text-[10px]">
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-full bg-[#38a878] grid place-items-center shrink-0"><iconify-icon class="text-white text-[9px]" icon="mdi:check"></iconify-icon></span><span class="text-[#4a6357]">预约状态为「待审核取消」，处于冻结中</span></div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-full bg-[#38a878] grid place-items-center shrink-0"><iconify-icon class="text-white text-[9px]" icon="mdi:check"></iconify-icon></span><span class="text-[#4a6357]">未核销、未登记服务开始</span></div>
            <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded-full bg-[#38a878] grid place-items-center shrink-0"><iconify-icon class="text-white text-[9px]" icon="mdi:check"></iconify-icon></span><span class="text-[#4a6357]">无重复审批记录（审批一次性且不可逆）</span></div>
          </div>
        </div>
        <div class="mt-3 grid grid-cols-2 gap-2.5">
          <button class="py-3 rounded-2xl bg-[#38a878] text-white text-[12px] font-semibold shadow-[0_6px_14px_rgba(56,168,120,0.24)]" onclick="doAudit('approve','${a.appId}',this)" type="button">
            同意取消<span class="block text-[9px] font-normal opacity-80 mt-0.5">释放名额并生成退款单</span>
          </button>
          <button class="py-3 rounded-2xl bg-[#fff4e8] border border-[#f7e2c0] text-[#c98a3c] text-[12px] font-semibold" onclick="doAudit('reject','${a.appId}',this)" type="button">
            驳回申请<span class="block text-[9px] font-normal opacity-80 mt-0.5">恢复已确认，不释放名额</span>
          </button>
        </div>
      </section>`;
    }).join('') : '<div class="text-[11px] text-[#8aa398] text-center py-6">暂无待审批申请</div>';
  });
}

async function loadDone() {
  await call('/api/shop/app/list?status=4&page=1&size=20', { role: 'staff' }, d => {
    const list = (d.list || []).slice(0, 5);
    document.getElementById('doneList').innerHTML = (list.length ? list.map(a => `
      <div class="rounded-2xl bg-white p-3.5 shadow-[0_4px_14px_rgba(45,110,85,0.06)]">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-semibold text-[#22402f]">${a.appId} · ${a.petName}</span>
          <span class="px-2 py-0.5 rounded-full bg-[#e8f6ef] text-[#2f8a63] text-[9px]">已取消（退款单已生成）</span>
        </div>
        <p class="text-[10px] text-[#8aa398] mt-1">${fmtDT(a.startTime)} · 名额已释放</p>
      </div>`).join('') : '<div class="text-[11px] text-[#8aa398] text-center py-4">暂无已处理记录</div>') +
      '<div class="mt-3 rounded-2xl bg-[#f3effc] border border-[#e5dcf8] p-3.5"><p class="text-[10px] leading-relaxed text-[#8574ab]">审批记录不可修改；同意取消后如退款失败，只影响退款单状态，预约保持已取消，名额不恢复。</p></div>';
    document.querySelectorAll('.tab-btn')[1].textContent = '已处理 ' + (d.total || 0);
  });
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = 'tab-btn px-3 py-1.5 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[11px]';
  });
  btn.className = 'tab-btn px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[11px] font-medium';
  document.getElementById('tabPending').classList.toggle('hidden', tab !== 'pending');
  document.getElementById('tabDone').classList.toggle('hidden', tab !== 'done');
  if (tab === 'done') loadDone();
}

async function doAudit(action, appId, btn) {
  btn.disabled = true;
  const reason = action === 'reject' ? prompt('请填写驳回原因（记录到操作日志）：') || '' : undefined;
  try {
    const path = action === 'approve' ? '/api/shop/audit/approve' : '/api/shop/audit/reject';
    const body = action === 'approve' ? { appId } : { appId, reason };
    await call(path, { method: 'POST', role: 'staff', body }, (d, msg) => {
      toast(msg || '已处理');
      loadPending();
    });
  } catch (e) { btn.disabled = false; }
}

loadPending();
</script>
</body>
</html>
