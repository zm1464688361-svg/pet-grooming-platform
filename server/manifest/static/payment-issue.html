<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>支付异常单处置 · 门店端</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<script src="app.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#e8f4ef]">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f7fbf9] flex flex-col overflow-hidden relative text-[#2b3a34]">
<header class="shrink-0 bg-white px-4 pt-3 pb-2.5 border-b border-[#eef4f1]">
<div class="flex items-center gap-3">
<a class="w-8 h-8 grid place-items-center text-[#4a6357]" href="workbench.html">
<iconify-icon class="text-xl" icon="mdi:arrow-left"></iconify-icon>
</a>
<div class="flex-1">
<h1 class="text-[15px] font-bold text-[#1d3a2e]">支付异常单</h1>
<p class="text-[10px] text-[#8aa398] mt-0.5">店长 / 客服共用视角 · 按顺序处置</p>
</div>
<span class="px-2 py-1 rounded-full bg-[#f2eefb] text-[#7a63b0] text-[10px] font-medium" id="pendingBadge">待处理 -</span>
</div>
<div class="flex gap-2 mt-2.5">
<button class="view-btn px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[11px] font-medium" onclick="switchView('manager', this)">店长视角</button>
<button class="view-btn px-3 py-1.5 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[11px]" onclick="switchView('cs', this)">客服视角</button>
</div>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-24">
<!-- 产生条件 -->
<section class="mt-3 rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)]">
<h2 class="text-[12px] font-bold text-[#1d3a2e] flex items-center gap-1.5">
<iconify-icon class="text-[#7a63b0] text-base" icon="mdi:help-circle-outline"></iconify-icon>
          异常单如何产生
        </h2>
<div class="mt-2.5 grid grid-cols-1 gap-1.5 text-[10px] text-[#7d958a]">
<div class="flex gap-2 rounded-lg bg-[#f7fbf9] px-2.5 py-2"><span class="text-[#7a63b0] font-semibold shrink-0">01</span><span>渠道已扣款，但支付回调超时未到达系统</span></div>
<div class="flex gap-2 rounded-lg bg-[#f7fbf9] px-2.5 py-2"><span class="text-[#7a63b0] font-semibold shrink-0">02</span><span>锁定 5 分钟超时关单，但渠道随后返回支付成功</span></div>
<div class="flex gap-2 rounded-lg bg-[#f7fbf9] px-2.5 py-2"><span class="text-[#7a63b0] font-semibold shrink-0">03</span><span>同一预约出现两条不同渠道流水号</span></div>
</div>
</section>
<!-- 待处理清单 -->
<section class="mt-3">
<div class="flex items-center justify-between mb-2">
<h2 class="text-[12px] font-bold text-[#1d3a2e]">待处理清单</h2>
<span class="text-[10px] text-[#a2b5ab]" id="hangAmount">挂账金额 -</span>
</div>
<div id="pendingCards"><div class="text-[11px] text-[#8aa398] text-center py-4">加载中…</div></div>
</section>
<!-- 已处理异常单 -->
<section class="mt-4">
<h2 class="text-[12px] font-bold text-[#1d3a2e] mb-2">近期已处理</h2>
<div class="rounded-2xl bg-white divide-y divide-[#f2f7f4] shadow-[0_4px_14px_rgba(45,110,85,0.06)]" id="doneCards">
<div class="px-3.5 py-2.5 text-[11px] text-[#8aa398]">加载中…</div>
</div>
</section>
</main>
<div class="hidden absolute left-1/2 -translate-x-1/2 bottom-24 z-40 px-4 py-2.5 rounded-full bg-[#22402f] text-white text-[11px] shadow-lg" id="toast"></div>
</div>
<script>
const EXC_TYPE = { 1: '关闭后支付（渠道已扣款，订单已关闭）', 2: '重复支付（异号流水）' };

function excCard(e) {
  return `
  <div class="rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)] border border-[#e5dcf8]">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-[12px] font-bold text-[#22402f]">${e.excId}</p>
        <p class="text-[10px] text-[#a2b5ab] mt-0.5">关联 ${e.appId} · ${fmtDT(e.createdAt)}</p>
      </div>
      <span class="px-2 py-1 rounded-full bg-[#f2eefb] text-[#7a63b0] text-[9px] font-semibold">待处理</span>
    </div>
    <div class="mt-2.5 space-y-1.5 text-[10px]">
      <div class="flex justify-between"><span class="text-[#a2b5ab]">渠道流水号</span><span class="text-[#4a6357]">${e.transactionId}</span></div>
      <div class="flex justify-between"><span class="text-[#a2b5ab]">渠道扣款</span><span class="text-[#22402f] font-semibold">¥${fmtYuan(e.amount)}（已扣）</span></div>
      <div class="flex justify-between"><span class="text-[#a2b5ab]">系统预约状态</span><span class="text-[#c98a3c]">${e.appStatusName || '已关闭'}</span></div>
      <div class="flex justify-between"><span class="text-[#a2b5ab]">异常类型</span><span class="text-[#7a63b0]">${EXC_TYPE[e.excType] || '其他'}</span></div>
    </div>
    <div class="mt-2 rounded-lg bg-[#faf8ff] px-2.5 py-2.5">
      <p class="text-[9px] text-[#8574ab] font-medium mb-1.5">处置顺序（必须逐步）</p>
      <div class="space-y-1.5 text-[10px]">
        <div class="flex items-center justify-between gap-2"><span class="flex items-center gap-1.5 text-[#5b5470]"><span class="w-4 h-4 rounded-full bg-[#e5dcf8] text-[#7a63b0] text-[9px] font-bold grid place-items-center shrink-0">1</span>核对渠道流水与台账是否一致</span><span class="text-[9px] text-[#a2b5ab]">待做</span></div>
        <div class="flex items-center justify-between gap-2"><span class="flex items-center gap-1.5 text-[#5b5470]"><span class="w-4 h-4 rounded-full bg-[#e5dcf8] text-[#7a63b0] text-[9px] font-bold grid place-items-center shrink-0">2</span>确认金额后登记异常并转退款</span><span class="text-[9px] text-[#a2b5ab]">待做</span></div>
        <div class="flex items-center justify-between gap-2"><span class="flex items-center gap-1.5 text-[#5b5470]"><span class="w-4 h-4 rounded-full bg-[#e5dcf8] text-[#7a63b0] text-[9px] font-bold grid place-items-center shrink-0">3</span>登记处置结果，关闭异常单</span><span class="text-[9px] text-[#a2b5ab]">待做</span></div>
      </div>
      <p class="text-[9px] text-[#a89bc7] mt-1.5 leading-relaxed">预约状态不变、名额不恢复；退款走全额原路退回（type=3）。</p>
    </div>
    <div class="mt-3">
      <button class="w-full py-2.5 rounded-full bg-[#7a63b0] text-white text-[11px] font-semibold" onclick="processExc('${e.excId}',this)" type="button">执行下一步处置 · 发起原路退款</button>
      <p class="text-[9px] text-[#b6c7bf] text-center mt-1.5">处置记录会写入员工日志，C 端可查看到账</p>
    </div>
  </div>`;
}

function switchView(mode, btn) {
  document.querySelectorAll('.view-btn').forEach(b => b.className = 'view-btn px-3 py-1.5 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[11px]');
  btn.className = 'view-btn px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[11px] font-medium';
  localStorage.setItem('demo_staff', mode === 'manager' ? 'manager_01' : 'cs_01');
  toast(mode === 'manager' ? '已切换店长视角' : '已切换客服视角');
}

async function loadExc() {
  await call('/api/shop/exception/list?page=1&size=20', { role: 'staff' }, d => {
    const all = d.list || [];
    const pending = all.filter(e => e.status === 1);
    const done = all.filter(e => e.status !== 1);
    document.getElementById('pendingCards').innerHTML = pending.length ? pending.map(excCard).join('') : '<div class="text-[11px] text-[#8aa398] text-center py-4 bg-white rounded-2xl">暂无待处理异常单</div>';
    document.getElementById('doneCards').innerHTML = done.length ? done.map(e => `
      <div class="px-3.5 py-2.5 flex items-center justify-between">
        <div><p class="text-[11px] font-medium text-[#22402f]">${e.excId}</p><p class="text-[9px] text-[#a2b5ab] mt-0.5">${EXC_TYPE[e.excType] || ''} · ¥${fmtYuan(e.amount)} 已原路退款</p></div>
        <span class="text-[9px] px-2 py-0.5 rounded-full bg-[#e8f6ef] text-[#2f8a63]">退款完成</span>
      </div>`).join('') : '<div class="px-3.5 py-2.5 text-[11px] text-[#8aa398]">暂无已处理记录</div>';
    document.getElementById('hangAmount').textContent = '挂账金额 ¥' + fmtYuan(pending.reduce((s, e) => s + e.amount, 0));
    document.getElementById('pendingBadge').textContent = '待处理 ' + pending.length;
  });
}

async function processExc(excId, btn) {
  btn.disabled = true;
  try {
    await call('/api/shop/exception/process', { method: 'POST', role: 'staff', body: { excId } }, (d, msg) => {
      toast(msg || '已发起原路退款');
      loadExc();
    });
  } catch (e) { btn.disabled = false; }
}

loadExc();
</script>
</body>
</html>
