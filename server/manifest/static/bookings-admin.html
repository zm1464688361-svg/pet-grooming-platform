<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>预约查询 · 店长端</title>
<script src="vendor/tailwindcss.js"></script>
<script src="vendor/iconify-icon.min.js"></script>
<script src="app.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#e8f4ef]">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f7fbf9] flex flex-col overflow-hidden relative text-[#2b3a34]">
<header class="shrink-0 bg-white px-4 pt-3 pb-2.5 border-b border-[#eef4f1]">
<div class="flex items-center gap-3">
<a class="w-8 h-8 grid place-items-center text-[#4a6357]" href="workbench.html">
<iconify-icon class="text-xl" icon="mdi:arrow-left"></iconify-icon>
</a>
<div class="flex-1">
<h1 class="text-[15px] font-bold text-[#1d3a2e]">预约查询</h1>
<p class="text-[10px] text-[#8aa398] mt-0.5">店长视角 · 含双向备注</p>
</div>
<a class="text-[10px] px-2.5 py-1.5 rounded-full bg-[#f0f7f3] text-[#4a8f6f]" href="frontdesk.html">前台核销台</a>
</div>
<div class="mt-2.5 flex items-center gap-2 rounded-xl bg-[#f7fbf9] border border-[#eef4f1] px-3 py-2">
<iconify-icon class="text-[#8aa398] text-sm" icon="mdi:magnify"></iconify-icon>
<input class="flex-1 bg-transparent text-[11px] outline-none placeholder:text-[#b6c7bf]" id="searchInput" oninput="searchBooking()" placeholder="搜索预约号 / 宠物名 / 手机号" type="text"/>
</div>
<div class="flex gap-1.5 mt-2 overflow-x-auto no-scrollbar pb-0.5">
<button class="fb shrink-0 px-2.5 py-1 rounded-full bg-[#38a878] text-white text-[10px] font-medium" onclick="filterStatus('all', this)">全部</button>
<button class="fb shrink-0 px-2.5 py-1 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[10px]" onclick="filterStatus('待核销', this)">待核销</button>
<button class="fb shrink-0 px-2.5 py-1 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[10px]" onclick="filterStatus('服务中', this)">服务中</button>
<button class="fb shrink-0 px-2.5 py-1 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[10px]" onclick="filterStatus('已完成', this)">已完成</button>
<button class="fb shrink-0 px-2.5 py-1 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[10px]" onclick="filterStatus('未到店', this)">未到店</button>
<button class="fb shrink-0 px-2.5 py-1 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[10px]" onclick="filterStatus('已取消', this)">已取消</button>
</div>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-24">
<p class="mt-3 text-[10px] text-[#a2b5ab]" id="resultHint">共 3 条结果 · 按预约时间排序</p>
<div class="mt-2 space-y-3" id="bookingList"><div class="text-[11px] text-[#8aa398] text-center py-6">加载中…</div></div>
<div class="hidden mt-10 flex flex-col items-center text-center" id="emptyState">
<div class="w-16 h-16 rounded-full bg-[#eef7f2] grid place-items-center">
<iconify-icon class="text-[30px] text-[#a8c7b8]" icon="mdi:clipboard-search-outline"></iconify-icon>
</div>
<p class="text-[12px] font-medium text-[#5b7a6d] mt-3">没有匹配的预约</p>
<p class="text-[10px] text-[#a2b5ab] mt-1">试试更换关键词或状态筛选</p>
</div>
</main>
<nav class="shrink-0 bg-white border-t border-[#e6f0eb] px-2 pt-1.5 pb-2 flex items-center justify-around">
<a class="flex flex-col items-center gap-0.5 w-16 text-[#9aaba3]" href="workbench.html">
<iconify-icon class="text-[22px]" icon="mdi:view-dashboard-outline"></iconify-icon>
<span class="text-[10px]">工作台</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16 text-[#38a878]" href="bookings-admin.html">
<iconify-icon class="text-[22px]" icon="mdi:clipboard-search-outline"></iconify-icon>
<span class="text-[10px] font-medium">预约查询</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16 text-[#9aaba3]" href="ledger.html">
<iconify-icon class="text-[22px]" icon="mdi:book-open-variant"></iconify-icon>
<span class="text-[10px]">台账</span>
</a>
</nav>
</div>
<script>
const STATUS_FILTER = { '待核销': 2, '服务中': 6, '已完成': 7, '未到店': 8, '已取消': 4 };
let activeStatus = 'all';
let keyword = '';
let allRows = [];

function cardHtml(a) {
  const canVerify = a.status === 2;
  const canNoShow = a.status === 2 && new Date(a.endTime) < new Date();
  return `<div class="rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)]" data-key="${(a.appId + ' ' + a.petName + ' ' + a.userPhone).toLowerCase()}" data-status="${a.statusName}">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-[#eaf7f0] grid place-items-center"><iconify-icon class="text-[#38a878]" icon="mdi:dog"></iconify-icon></div>
        <div>
          <p class="text-[12px] font-bold text-[#22402f]">${a.petName} · ${a.userPhone}</p>
          <p class="text-[10px] text-[#a2b5ab] mt-0.5">${a.appId} · ${fmtDT(a.startTime)}</p>
        </div>
      </div>
      <span class="px-2 py-0.5 rounded-full ${a.status === 2 ? 'bg-[#e8f6ef] text-[#2f8a63]' : a.status === 6 ? 'bg-[#e9f1fe] text-[#3a6fb0]' : a.status === 7 ? 'bg-[#f0f2f1] text-[#7d958a]' : 'bg-[#fdeee5] text-[#c9563a]'} text-[9px] font-semibold">${a.statusName}</span>
    </div>
    ${a.shopRemark ? `<div class="mt-2.5 rounded-lg bg-[#f7fbf9] px-2.5 py-2 text-[10px] text-[#7d958a] leading-relaxed"><span class="text-[#3f8f6b] font-medium">门店备注：</span>${a.shopRemark}</div>` : ''}
    ${a.userRemark ? `<div class="mt-2 rounded-lg bg-[#fff8ee] px-2.5 py-2 text-[10px] text-[#a1834e] leading-relaxed"><span class="font-medium">宠主备注：</span>${a.userRemark}</div>` : ''}
    <div class="mt-2.5 flex items-center justify-between">
      <span class="text-[11px] font-bold text-[#22402f]">¥${fmtYuan(a.price)}</span>
      <div class="flex gap-2">
        ${canVerify ? '<a class="px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[10px] font-medium" href="frontdesk.html">去核销</a>' : ''}
        ${canNoShow ? '<a class="px-3 py-1.5 rounded-full border border-[#f3dcd4] text-[#c9563a] text-[10px]" href="no-show.html">标记未到店</a>' : ''}
        ${a.status === 6 || a.status === 7 ? '<a class="px-3 py-1.5 rounded-full bg-[#f0f7f3] text-[#3f8f6b] text-[10px] font-medium" href="service.html">服务进度</a>' : ''}
        ${a.status === 7 ? '<a class="px-3 py-1.5 rounded-full border border-[#e6f0eb] text-[#4a6357] text-[10px]" href="service.html">宠物历史记录</a>' : ''}
      </div>
    </div>
  </div>`;
}

async function loadRows() {
  await call('/api/shop/app/list?page=1&size=50', { role: 'staff' }, d => {
    allRows = d.list || [];
    applyFilter();
  });
}

function applyFilter() {
  keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const visible = allRows.filter(a => {
    const statusMatch = activeStatus === 'all' || a.status === STATUS_FILTER[activeStatus];
    const keyMatch = keyword === '' || (a.appId + ' ' + a.petName + ' ' + a.userPhone).toLowerCase().includes(keyword);
    return statusMatch && keyMatch;
  });
  document.getElementById('bookingList').innerHTML = visible.length ? visible.map(cardHtml).join('') : '';
  document.getElementById('resultHint').textContent = '共 ' + visible.length + ' 条结果 · 按预约时间倒序';
  document.getElementById('emptyState').classList.toggle('hidden', visible.length > 0);
}

function filterStatus(status, btn) {
  activeStatus = status;
  document.querySelectorAll('.fb').forEach(b => b.className = 'fb shrink-0 px-2.5 py-1 rounded-full bg-[#f2f7f4] text-[#5b7a6d] text-[10px]');
  btn.className = 'fb shrink-0 px-2.5 py-1 rounded-full bg-[#38a878] text-white text-[10px] font-medium';
  applyFilter();
}

function searchBooking() { applyFilter(); }
loadRows();
</script>
</body>
</html>
