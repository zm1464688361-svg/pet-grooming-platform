<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>退款详情 · 毛球家宠物洗护</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<script src="app.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#e8f4ef]">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f7fbf9] flex flex-col overflow-hidden relative text-[#2b3a34]">
<header class="shrink-0 bg-white px-4 py-3 flex items-center gap-3 border-b border-[#eef4f1]">
<a class="w-8 h-8 grid place-items-center text-[#4a6357]" href="booking-detail.html">
<iconify-icon class="text-xl" icon="mdi:arrow-left"></iconify-icon>
</a>
<h1 class="text-[15px] font-bold text-[#1d3a2e]">退款详情</h1>
<span class="ml-auto text-[10px] px-2 py-1 rounded-full bg-[#f2f7f4] text-[#7d958a]">退款单独立于预约状态</span>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-28" id="mainBody">
<div class="text-[12px] text-[#8aa398] text-center py-10">加载中…</div>
</main>
<div class="shrink-0 bg-white border-t border-[#eef4f1] px-4 py-3 flex gap-3">
<a class="flex-1 py-3 rounded-full border border-[#d9e7e0] text-[13px] font-medium text-[#4a6357] text-center" href="refund-tracking.html">门店退款跟进</a>
<button class="flex-1 py-3 rounded-full bg-[#38a878] text-white text-[13px] font-semibold" onclick="location.reload()" type="button">刷新退款状态</button>
</div>
</div>
<script>
const TYPE_TEXT = { 1: '取消退款', 2: '重复支付退款', 3: '支付异常退款' };

function refundCard(r) {
  const failed = r.status === 3, pending = r.status === 1;
  const pillCls = failed ? 'bg-[#fdeee5] text-[#c9563a]' : pending ? 'bg-[#fdf3e3] text-[#c98a3c]' : 'bg-[#e8f6ef] text-[#2f8a63]';
  const iconCls = failed ? 'bg-[#fdeee5] text-[#e07a4b]' : pending ? 'bg-[#fdf3e3] text-[#d98a3a]' : 'bg-[#eaf7f0] text-[#2f8a63]';
  return `
  <section class="mt-3 rounded-3xl bg-white p-5 shadow-[0_4px_14px_rgba(45,110,85,0.06)] ${failed ? 'border border-[#f6ddd2]' : ''}">
    <div class="flex items-start justify-between">
      <div>
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full ${pillCls} text-[11px] font-semibold">
          <iconify-icon class="text-sm" icon="${failed ? 'mdi:alert-circle-outline' : pending ? 'mdi:clock-outline' : 'mdi:check-circle-outline'}"></iconify-icon>
          ${r.statusName} · ${r.refundName}
        </span>
        <p class="text-[26px] font-bold text-[#1d3a2e] mt-3 leading-none">¥${fmtYuan(r.amount)}</p>
        <p class="text-[11px] text-[#8aa398] mt-1.5">退款单 ${r.refundId} · 重试 ${r.retryCount} 次</p>
      </div>
      <div class="w-14 h-14 rounded-full ${iconCls} grid place-items-center shrink-0">
        <iconify-icon class="text-[28px]" icon="mdi:cash-refund"></iconify-icon>
      </div>
    </div>
    ${r.failMsg ? `<div class="mt-4 rounded-xl bg-[#fdf6f2] px-3 py-2.5"><p class="text-[11px] font-semibold text-[#b8683f]">失败原因</p><p class="text-[11px] text-[#a97a63] mt-1 leading-relaxed">${r.failMsg}。退款失败不影响预约状态，也不会恢复名额。</p></div>` : ''}
    ${r.refundedAt ? `<div class="mt-4 rounded-xl bg-[#f0faf5] px-3 py-2.5"><p class="text-[11px] text-[#2f8a63] font-medium">退款成功时间：${fmtDT(r.refundedAt)}（原路退回）</p></div>` : ''}
  </section>
  <section class="mt-3 rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)] border border-[#eef4f1]">
      <h2 class="text-[13px] font-bold text-[#1d3a2e] mb-3">金额与口径</h2>
      <div class="space-y-2.5 text-[12px]">
        <div class="flex justify-between"><span class="text-[#8aa398]">预约款（已支付）</span><span class="font-medium text-[#22402f]">¥${fmtYuan(r.amount)}</span></div>
        <div class="flex justify-between"><span class="text-[#8aa398]">核销收入</span><span class="font-medium text-[#a2b5ab]">¥0.00（未核销）</span></div>
        <div class="flex justify-between"><span class="text-[#8aa398]">应退金额</span><span class="font-medium text-[#22402f]">¥${fmtYuan(r.amount)}</span></div>
        <div class="flex justify-between"><span class="text-[#8aa398]">已退金额</span><span class="font-semibold ${r.status === 2 ? 'text-[#c9563a]' : 'text-[#22402f]'}">¥${r.status === 2 ? fmtYuan(r.amount) : '0.00'}</span></div>
        <div class="flex justify-between pt-2.5 border-t border-dashed border-[#e6f0eb]"><span class="text-[#8aa398]">申请时间</span><span class="font-medium text-[#22402f]">${fmtDT(r.createdAt)}</span></div>
      </div>
      <p class="text-[9px] text-[#b6c7bf] mt-2 leading-relaxed">核销收入按服务完成(status=7)计入；未核销订单取消为全额退款，金额口径与门店台账独立核算。</p>
    </section>
    <a class="mt-3 flex items-center justify-between rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)]" href="booking-detail.html?appId=${r.appId}">
    <div>
      <p class="text-[10px] text-[#a2b5ab]">关联预约</p>
      <p class="text-[12px] font-semibold text-[#22402f] mt-0.5">${r.appId} · ${r.petName}</p>
      <p class="text-[10px] text-[#c98a3c] mt-1">预约状态：${r.appStatusName}${r.appStatus === 3 ? '（审批期间冻结）' : ''}</p>
    </div>
    <iconify-icon class="text-[#b6c7bf] text-xl" icon="mdi:chevron-right"></iconify-icon>
  </a>`;
}

async function load() {
  await call('/api/user/refund/list', {}, d => {
    const list = d.list || [];
    const el = document.getElementById('mainBody');
    if (!list.length) {
      el.innerHTML = '<div class="mt-3 rounded-2xl bg-white p-6 text-center text-[12px] text-[#8aa398]">暂无退款单</div>';
      return;
    }
    el.innerHTML = list.map(refundCard).join('') + `
    <div class="mt-3 rounded-2xl bg-[#fff8ee] border border-[#f7e7cd] p-3.5 flex items-start gap-2">
      <iconify-icon class="text-[#e0a250] text-base mt-0.5 shrink-0" icon="mdi:headset"></iconify-icon>
      <p class="text-[10px] leading-relaxed text-[#a1834e]">如退款长时间未到账，可联系门店客服。客服会在「退款跟进」中重试渠道打款，成功后本页状态自动更新。</p>
    </div>`;
  });
}
load();
</script>
</body>
</html>
