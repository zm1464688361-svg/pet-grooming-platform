<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>时段管理 · 店长端</title>
<script src="vendor/tailwindcss.js"></script>
<script src="vendor/iconify-icon.min.js"></script>
<script src="app.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#e8f4ef]">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#f7fbf9] flex flex-col overflow-hidden relative text-[#2b3a34]">
<header class="shrink-0 bg-white px-4 py-3 flex items-center gap-3 border-b border-[#eef4f1]">
<a class="w-8 h-8 grid place-items-center text-[#4a6357]" href="workbench.html">
<iconify-icon class="text-xl" icon="mdi:arrow-left"></iconify-icon>
</a>
<div class="flex-1">
<h1 class="text-[15px] font-bold text-[#1d3a2e]">时段管理</h1>
<p class="text-[10px] text-[#8aa398] mt-0.5">店长 陈可 · shop_001</p>
</div>
<button class="px-3 py-2 rounded-full bg-[#38a878] text-white text-[11px] font-semibold flex items-center gap-1" onclick="openCreate()" type="button">
<iconify-icon class="text-sm" icon="mdi:plus"></iconify-icon>
        新建时段
      </button>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-24">
<div class="mt-3 flex gap-2">
<button class="slot-filter px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[11px] font-medium" onclick="filterSlot('today', this)">今天 11/15</button>
<button class="slot-filter px-3 py-1.5 rounded-full bg-white text-[#5b7a6d] text-[11px]" onclick="filterSlot('tomorrow', this)">明天 11/16</button>
<button class="slot-filter px-3 py-1.5 rounded-full bg-white text-[#5b7a6d] text-[11px]" onclick="filterSlot('all', this)">全部已发布</button>
</div>
<div class="mt-3 rounded-2xl bg-[#eaf7f0] px-3.5 py-2.5 flex items-center gap-2">
<iconify-icon class="text-[#2f8a63] text-sm shrink-0" icon="mdi:information-outline"></iconify-icon>
<p class="text-[10px] leading-relaxed text-[#3f7a5f]">每时段最多接待 3 只；名额在订单创建成功时占用，未支付保留 5 分钟。已开始/结束的时段不在 C 端展示。</p>
</div>
<div class="mt-3 space-y-3" id="slotCards"><div class="text-[11px] text-[#8aa398] text-center py-6">加载中…</div></div>
<div class="mt-4 rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)]">
<h2 class="text-[12px] font-bold text-[#1d3a2e] mb-2">发布规则</h2>
<ul class="space-y-1.5 text-[10px] text-[#8aa398] leading-relaxed">
<li class="flex gap-1.5"><span class="text-[#38a878]">·</span>暂停后 C 端立即隐藏该时段并置灰，已有预约不受影响。</li>
<li class="flex gap-1.5"><span class="text-[#38a878]">·</span>删除仅限无有效预约的时段，含有预约时需先与客服确认处理。</li>
<li class="flex gap-1.5"><span class="text-[#38a878]">·</span>编辑容量不得低于已占用数量（当前最多 3）。</li>
</ul>
</div>
</main>
<div class="hidden absolute left-1/2 -translate-x-1/2 bottom-24 z-40 px-4 py-2.5 rounded-full bg-[#22402f] text-white text-[11px] shadow-lg" id="toast"></div>
<div class="hidden absolute inset-0 bg-black/35 z-30 flex items-end" id="createSheet">
<div class="w-full bg-white rounded-t-3xl p-5 pb-6">
<div class="w-10 h-1 rounded-full bg-[#e0e8e4] mx-auto mb-4"></div>
<h3 class="text-[15px] font-bold text-[#1d3a2e] text-center" id="sheetTitle">新建可预约时段</h3>
<div class="mt-4 space-y-3">
<div>
<label class="text-[11px] text-[#8aa398]">日期</label>
<div class="mt-1.5 flex gap-2">
<button class="px-3 py-2 rounded-lg bg-[#eaf7f0] text-[11px] text-[#2f8a63] font-medium" type="button">11月16日</button>
<button class="px-3 py-2 rounded-lg bg-[#f7fbf9] text-[11px] text-[#7d958a]" type="button">11月17日</button>
</div>
</div>
<div class="grid grid-cols-2 gap-2">
<div>
<label class="text-[11px] text-[#8aa398]">开始时间</label>
<input class="mt-1.5 w-full rounded-xl border border-[#e6f0eb] bg-[#fafcfb] px-3 py-2 text-[12px] outline-none focus:border-[#38a878]" id="startTimeInput" type="time" value="14:00"/>
</div>
<div>
<label class="text-[11px] text-[#8aa398]">结束时间</label>
<input class="mt-1.5 w-full rounded-xl border border-[#e6f0eb] bg-[#fafcfb] px-3 py-2 text-[12px] outline-none focus:border-[#38a878]" id="endTimeInput" type="time" value="15:00"/>
</div>
</div>
<div>
<label class="text-[11px] text-[#8aa398]">每时段容量（固定 3，不可修改）</label>
<input class="mt-1.5 w-full rounded-xl border border-[#e6f0eb] bg-[#fafcfb] px-3 py-2 text-[12px] outline-none bg-[#f2f7f4] text-[#a2b5ab]" id="capacityInput" disabled type="number" value="3"/>
</div>
</div>
<div class="mt-4 flex gap-3">
<button class="flex-1 py-3 rounded-full bg-[#f2f7f4] text-[13px] font-medium text-[#4a6357]" onclick="closeSheet()" type="button">取消</button>
<button class="flex-1 py-3 rounded-full bg-[#38a878] text-[13px] font-semibold text-white" onclick="saveSlot()" type="button">保存并发布</button>
</div>
</div>
</div>
</div>
<script>
let allSlots = [];
let curFilter = 'all';
let editSlotId = '';

function slotCard(s) {
  const occupied = s.occupied;
  const remaining = (s.maxCapacity || 3) - occupied;
  const started = new Date(s.startTime) < new Date();
  const ended = new Date(s.endTime) < new Date();
  const paused = s.status === 2;
  const day = s.startTime.slice(0, 10);
  const badge = paused ? '<span class="px-2 py-1 rounded-full bg-[#fff4e8] text-[#c98a3c] text-[10px] font-medium">已暂停</span>'
    : started ? `<span class="px-2 py-1 rounded-full bg-[#f0f2f1] text-[#8aa398] text-[10px] font-medium">${ended ? '已结束' : '进行中'} · 不可编辑</span>`
    : '<span class="px-2 py-1 rounded-full bg-[#e8f6ef] text-[#2f8a63] text-[10px] font-medium flex items-center gap-1"><iconify-icon class="text-xs" icon="mdi:check-circle"></iconify-icon>已发布</span>';
  const pct = Math.round(occupied / (s.maxCapacity || 3) * 100);
  const st = appStats[s.slotId] || { confirmed: 0, verified: 0 };
  const actions = started
    ? ''
    : `<div class="mt-3 flex gap-2">
      ${paused ? `<button class="flex-1 py-2 rounded-full bg-[#eaf7f0] text-[11px] font-semibold text-[#2f8a63]" onclick="slotAct('resume','${s.slotId}',this)" type="button">恢复预约</button>` : `<button class="flex-1 py-2 rounded-full border border-[#e6f0eb] text-[11px] font-medium text-[#4a6357]" onclick="slotAct('pause','${s.slotId}',this)" type="button">暂停预约</button>`}
      <button class="flex-1 py-2 rounded-full border border-[#e6f0eb] text-[11px] font-medium text-[#4a6357]" onclick="openEdit('${s.slotId}')" type="button">编辑时间</button>
      <button class="px-3 py-2 rounded-full border border-[#f3dcd4] text-[11px] font-medium text-[#c9563a]" onclick="delSlot('${s.slotId}',${occupied})" type="button">删除</button>
    </div>`;
  return `<div class="rounded-2xl bg-white p-4 shadow-[0_4px_14px_rgba(45,110,85,0.06)] ${!started && !paused ? 'border border-[#d9efe3]' : ''}" data-day="${day}">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-[15px] font-bold text-[#22402f]">${fmtHM(s.startTime)} - ${fmtHM(s.endTime)}</p>
        <p class="text-[10px] text-[#a2b5ab] mt-0.5">${day} · 容量 3 只</p>
      </div>
      ${badge}
    </div>
    <div class="mt-3">
      <div class="flex justify-between text-[10px] mb-1"><span class="${remaining === 1 ? 'text-[#e07a4b] font-medium' : 'text-[#5b7a6d]'}">已占用 ${occupied} 只</span><span class="text-[#a2b5ab]">剩余 ${remaining} / 容量 ${s.maxCapacity || 3}</span></div>
      <div class="h-2 rounded-full bg-[#eef2f0] overflow-hidden"><div class="h-full" style="width:${pct}%;background:${remaining === 0 ? '#cdd6d2' : '#7ad2a9'}"></div></div>
    </div>
    <div class="mt-2.5 flex items-center justify-between text-[10px]">
      <span class="px-2 py-1 rounded-md bg-[#f7fbf9] text-[#7d958a]">${st.confirmed} 单已确认 ${st.verified} 单已核销</span>
      <span class="text-[#a2b5ab]">发布人：${s.createdBy || '店长'}</span>
    </div>
    ${actions}
  </div>`;
}

let appStats = {};

async function loadSlots() {
  await call('/api/shop/slot/list?page=1&size=50', { role: 'staff' }, d => {
    allSlots = d.list || d.slots || [];
    render();
  });
  // 按时段聚合订单状态（已确认 / 已核销）
  call('/api/shop/app/list?page=1&size=50', { role: 'staff' }, d => {
    appStats = {};
    (d.list || []).forEach(a => {
      const m = appStats[a.slotId] || (appStats[a.slotId] = { confirmed: 0, verified: 0 });
      if (a.status === 2 || a.status === 3) m.confirmed++;
      if (a.status >= 5 && a.status <= 7) m.verified++;
    });
    render();
  });
}

function render() {
  const today = new Date().toISOString().slice(0, 10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const list = allSlots.filter(s => {
    const d = s.startTime.slice(0, 10);
    return curFilter === 'all' || (curFilter === 'today' && d === today) || (curFilter === 'tomorrow' && d === tomorrow);
  });
  document.getElementById('slotCards').innerHTML = list.length ? list.map(slotCard).join('') : '<div class="text-[11px] text-[#8aa398] text-center py-6">该日期暂无时段</div>';
}

function filterSlot(day, btn) {
  curFilter = day;
  document.querySelectorAll('.slot-filter').forEach(b => b.className = 'slot-filter px-3 py-1.5 rounded-full bg-white text-[#5b7a6d] text-[11px]');
  btn.className = 'slot-filter px-3 py-1.5 rounded-full bg-[#38a878] text-white text-[11px] font-medium';
  render();
}

async function slotAct(action, slotId, btn) {
  btn.disabled = true;
  try {
    await call(`/api/shop/slot/${action}`, { method: 'POST', role: 'staff', body: { slotId } }, () => {});
    toast(action === 'pause' ? '已暂停预约，C 端该时段将置灰' : '已恢复预约，C 端可正常下单');
    loadSlots();
  } catch (e) { btn.disabled = false; }
}

async function delSlot(slotId, occupied) {
  if (occupied > 0) { toast('该时段已有 ' + occupied + ' 单预约，不可删除', false); return; }
  if (!confirm('确认删除该时段？删除后 C 端立即不可见。')) return;
  await call('/api/shop/slot/delete', { method: 'POST', role: 'staff', body: { slotId } }, () => { toast('时段已删除'); loadSlots(); });
}

function openCreate() {
  editSlotId = '';
  document.getElementById('sheetTitle').textContent = '新建可预约时段';
  document.getElementById('capacityInput').value = '3';
  document.getElementById('createSheet').classList.remove('hidden');
}

function openEdit(slotId) {
  editSlotId = slotId;
  const s = allSlots.find(x => x.slotId === slotId);
  document.getElementById('sheetTitle').textContent = '编辑时段时间';
  document.getElementById('startTimeInput').value = new Date(s.startTime).toTimeString().slice(0, 5);
  document.getElementById('endTimeInput').value = new Date(s.endTime).toTimeString().slice(0, 5);
  document.getElementById('capacityInput').value = '3';
  document.getElementById('createSheet').classList.remove('hidden');
}

function closeSheet() { document.getElementById('createSheet').classList.add('hidden'); }

async function saveSlot() {
  const date = curFilter === 'tomorrow' ? new Date(Date.now() + 86400000).toISOString().slice(0, 10)
    : curFilter === 'today' ? new Date().toISOString().slice(0, 10)
    : new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const st = document.getElementById('startTimeInput').value;
  const et = document.getElementById('endTimeInput').value;
  if (!st || !et || st >= et) { toast('结束时间必须晚于开始时间', false); return; }
  try {
    if (editSlotId) {
      await call('/api/shop/slot/update', { method: 'POST', role: 'staff', body: { slotId: editSlotId, startTime: `${date} ${st}:00`, endTime: `${date} ${et}:00` } }, () => {});
      toast('时段时间已修改');
    } else {
      await call('/api/shop/slot/create', { method: 'POST', role: 'staff', body: { startTime: `${date} ${st}:00`, endTime: `${date} ${et}:00` } }, () => {});
      toast('时段已创建并发布');
    }
    closeSheet();
    loadSlots();
  } catch (e) { /* toast 已提示 */ }
}

loadSlots();
</script>
</body>
</html>
